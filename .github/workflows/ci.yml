name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_FROZEN: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.6
          enable-cache: true

      - name: Install pinned Python and dependencies
        run: |
          uv python install 3.13.15
          uv sync --group dev --group ml
          uv sync --group dev --group ml --group semantic --dry-run

      - name: Validate source, Django, tests, and generated docs
        run: uv run python eng/validate.py

      - name: Validate Compose configuration
        run: |
          uv run --env-file .env.example python -m eng.configure_local
          # CI uses public example credentials; allow the image's non-root UID to read this file.
          chmod 0644 deploy/seaweedfs/s3.local.json
          docker compose config --quiet

      - name: Start pinned local infrastructure
        run: docker compose up -d --wait

      - name: Validate authoritative PostgreSQL contracts
        env:
          GITHUB_WEBHOOK_SECRET: releaseproof-ci-test-webhook-secret
        run: >-
          uv run --env-file .env.example pytest -m "not integration"
          --ds=apps.web.releaseproof.settings.base

      - name: Prove SeaweedFS bounded object contract
        env:
          RUN_S3_INTEGRATION: "1"
        run: |
          uv run --env-file .env.example python -m eng.bootstrap_object_store
          uv run --env-file .env.example python -m eng.smoke_object_store
          uv run --env-file .env.example pytest tests/integration/test_s3_contract.py

      - name: Show infrastructure diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=100

      - name: Stop local infrastructure
        if: always()
        run: docker compose down
