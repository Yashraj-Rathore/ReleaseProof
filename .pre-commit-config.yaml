default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: master-spec
        name: generated master spec
        entry: uv run python eng/sync_master_spec.py --check
        language: system
        pass_filenames: false
      - id: file-inventory
        name: file inventory
        entry: uv run python eng/update_file_inventory.py --check
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
